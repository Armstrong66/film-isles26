name: Build & Export ISLES 2026 Submission Container

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Conditioning Track (A, C, or NONE)"
        required: true
        default: "A"
        type: choice
        options:
          - "A"
          - "C"
          - "NONE"
      size:
        description: "Model Size (tiny, small, base)"
        required: true
        default: "tiny"
        type: choice
        options:
          - "tiny"
          - "small"
          - "base"
  push:
    paths:
      - "checkpoints/**"
      - "Dockerfile"
      - "entrypoint.py"
      - "pipeline/**"
      - "configs/**"
      - ".github/workflows/build_submission.yml"
    branches:
      - main
      - master

jobs:
  build-and-export:
    name: Build Docker Container & Export Submission Archive
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install omegaconf

      - name: Verify Submission Bundle & Config
        run: |
          TRACK="${{ github.event.inputs.track }}"
          SIZE="${{ github.event.inputs.size }}"
          if [ -z "$TRACK" ]; then TRACK="A"; fi
          if [ -z "$SIZE" ]; then SIZE="tiny"; fi
          echo "Preparing submission bundle for Track: $TRACK, Size: $SIZE"
          
          mkdir -p checkpoints
          # Verify checkpoint existence
          if [ ! -f checkpoints/fold_0_best.pth ] && [ -z "$(ls -A checkpoints/*.pth 2>/dev/null)" ]; then
            echo "❌ Error: No checkpoint found in checkpoints/."
            echo "Please ensure checkpoints/fold_0_best.pth is committed and pushed to git."
            exit 1
          fi
          echo "✓ Checkpoint verified:"
          ls -lh checkpoints/

      - name: Free Up Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "🐳 Building Docker image isles26-submission..."
          docker build -t isles26-submission -f Dockerfile .

      - name: Export & Compress Submission Image (.tar.gz)
        run: |
          set -o pipefail
          echo "📦 Exporting Docker image to isles26_submission.tar.gz for Grand Challenge..."
          docker save isles26-submission | gzip -c > isles26_submission.tar.gz
          ls -lh isles26_submission.tar.gz
          
          FILE_SIZE=$(stat -c%s isles26_submission.tar.gz 2>/dev/null || stat -f%z isles26_submission.tar.gz)
          echo "Exported archive size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "❌ Error: Exported archive is too small ($FILE_SIZE bytes). Container export failed."
            exit 1
          fi
          echo "✓ Container archive exported successfully."

      - name: Upload Submission Container Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isles26_submission_container
          path: isles26_submission.tar.gz
          retention-days: 14
