data:
  root: /data/derrick/isles26/raw/ATLAS3_Training_Raw
  images_dir: images
  masks_dir: masks
  meta_csv: metadata/metadata.csv
  inventory: inventory.json
  processed_dir: /data/derrick/isles26/processed
  n_splits: 5
  seed: 42
preprocessing:
  target_orientation: RAS
  normalization: per_scan_zscore
  clip_percentiles:
  - 0.5
  - 99.5
  target_shape:
  - 160
  - 256
  - 256
  resample: true
  num_workers: 8
chronicity:
  acute_max_days: 7
  subacute_max_days: 90
  unknown_token: unknown
  categories:
  - acute
  - subacute
  - chronic
  - unknown
split:
  stratify_by:
  - CHRONICITY_DERIVED
  - SITE
  test_size: 0.0
  val_fold: 0
training:
  epochs: 1000
  batch_size: 4
  patch_size:
  - 128
  - 128
  - 128
  optimizer: adamw
  lr: 0.0003
  weight_decay: 1.0e-05
  lr_scheduler: poly
  poly_exp: 0.9
  warmup_epochs: 20
  early_stopping_patience: 15
  mixed_precision: true
  grad_clip: 0.5
model:
  size: tiny
loss:
  dice_weight: 1.0
  ce_weight: 1.0
  boundary_weight: 0.5
  small_lesion_threshold_ml: 1.0
  small_lesion_weight: 2.0
conditioning:
  track: A
  film:
    metadata_dim: 5
    hidden_dim: 64
    inject_at: bottleneck
  llm:
    model_name: all-MiniLM-L6-v2
    embedding_dim: 384
    hidden_dim: 128
    inject_at: bottleneck
    freeze_llm: true
tta:
  enabled: true
  flips:
  - - 0
  - - 1
  - - 2
  - - 0
    - 1
  - - 0
    - 2
  - - 1
    - 2
  - - 0
    - 1
    - 2
postprocessing:
  min_component_size_voxels: 10
evaluation:
  metrics:
  - dice
  - hausdorff95
  - precision
  - recall
  size_bins:
    small:
    - 0
    - 1
    medium:
    - 1
    - 10
    large:
    - 10
    - 1000000000.0
logging:
  level: INFO
  log_dir: /home/derrick/projects/film-isles26/outputs/logs
